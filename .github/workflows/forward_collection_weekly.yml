name: forward_collection_weekly

# Weekly refresh of the matched_games.csv ESPN↔Kalshi join.
# The aggregate step (wp_vs_kalshi_aggregate) was moved local
# 2026-04-30 — Oliver runs it on demand against synced data.
# Per-game CSVs no longer live in the repo; nightly uploads
# them as GH Actions artifacts (see forward_collection.yml).
#
# Outputs refreshed:
#   - data/wp_kalshi_paired/matched_games.csv
#     (ticker_matcher.py: full ESPN↔Kalshi join over nba_master)

on:
  schedule:
    # 11:00 UTC Monday = 04:00 PDT / 03:00 PST — after Sunday night's
    # forward_collection run has committed.
    - cron: '0 11 * * 1'
  workflow_dispatch:

concurrency:
  group: forward_collection_weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Los_Angeles

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh matched_games.csv
        run: python -m analysis.ticker_matcher

      - name: Commit refreshed indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wp_kalshi_paired/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          STAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "[skip ci] Weekly index refresh $STAMP"
          git pull --rebase origin main
          git push origin main
