name: kalshi_logger

# DEPRECATED schedule (2026-04-21) — logger now runs locally.
# GH Actions cron was unreliable for the time-window coverage the
# logger requires (delayed scheduled runs caused catastrophic game
# gaps), and per-game snapshot volume was straining storage limits.
# File preserved with workflow_dispatch only so ad-hoc runs remain
# possible if the local setup is ever down.

on:
  workflow_dispatch:        # manual trigger only — scheduled runs disabled

concurrency:
  group: kalshi_logger
  cancel-in-progress: false  # blocks can overlap by design

permissions:
  contents: write

jobs:
  log_kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5h30m hard cap (workflow level)
    env:
      TZ: America/Los_Angeles

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Kalshi logger
        env:
          POLL_INTERVAL_SEC: '30'
          COMMIT_INTERVAL_SEC: '300'
          MAX_RUN_SEC: '18900'    # 5h15m
          IDLE_EXIT_SEC: '900'    # 15 min
        run: python -m logger.kalshi_logger
